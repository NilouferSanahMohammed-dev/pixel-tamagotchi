<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>little sprout &middot; a pixel plant buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="room">
  <div class="device" id="device">

    <div class="ear ear-left"></div>
    <div class="ear ear-right"></div>

    <div class="screen-bezel">
      <canvas id="screen" width="128" height="112"></canvas>
      <div class="scanlines"></div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <span class="stat-label">water</span>
        <div class="stat-track"><div class="stat-fill" id="waterFill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">sunlight</span>
        <div class="stat-track"><div class="stat-fill" id="sunlightFill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">energy</span>
        <div class="stat-track"><div class="stat-fill" id="energyFill"></div></div>
      </div>
    </div>

    <div class="button-row">
      <button class="pet-btn" id="waterBtn" title="Water">
        <span class="btn-icon">💧</span>
        <span class="btn-label">water</span>
      </button>
      <button class="pet-btn" id="sunBtn" title="Sunlight">
        <span class="btn-icon">☀️</span>
        <span class="btn-label">sun</span>
      </button>
      <button class="pet-btn" id="restBtn" title="Rest">
        <span class="btn-icon">🌙</span>
        <span class="btn-label">rest</span>
      </button>
    </div>

    <div class="nameplate" id="nameplate">yours &middot; day 1</div>
  </div>

  <p class="hint" id="hint">a tiny sprout, freshly planted, needs your care</p>
</div>

<script src="script.js"></script>
</body>
</html>
